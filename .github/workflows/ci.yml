name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=src/option_analyzer --cov-report=term-missing -m "not integration and not e2e"

  deploy:
    name: Deploy
    runs-on: [self-hosted, rasp]
    needs: [lint, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync dependencies
        run: cd /home/pi/proj/option-analyzer && uv sync
      - name: Restart service
        run: sudo systemctl --machine=pi@.host --user restart option-analyzer-app
      - name: Verify running
        run: sudo systemctl --machine=pi@.host --user is-active option-analyzer-app
